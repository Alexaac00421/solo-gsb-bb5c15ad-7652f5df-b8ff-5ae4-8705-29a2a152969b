services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-water}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waterpass}
      POSTGRES_DB: ${POSTGRES_DB:-water_billing}
    ports:
      # 便于本机直接连库排查；不需要可删除
      - "${POSTGRES_PORT_PUBLISH:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-water} -d ${POSTGRES_DB:-water_billing}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-water}:${POSTGRES_PASSWORD:-waterpass}@db:5432/${POSTGRES_DB:-water_billing}
      HTTP_PORT: "8080"
      SEED_RATE: ${SEED_RATE:-3.50}
      SEED_RATE_AT: ${SEED_RATE_AT:-2025-01-01T00:00:00Z}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "${HTTP_PORT:-8080}:8080"

volumes:
  pgdata:
