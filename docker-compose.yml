services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: water
      POSTGRES_PASSWORD: water
      POSTGRES_DB: waterdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water -d waterdb"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://water:water@db:5432/waterdb
      DB_CONNECT_RETRIES: "60"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
